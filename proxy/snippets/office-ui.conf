# ibisOffice ブラウザー版（profile office）。配布物は同梱しない。
# 相対パスで動くので、/office-ui/ のまま上流のルートへ渡す。
# 入場は HttpOnly クッキー。iframe は Authorization を付けられない。

location = /_office_gate {
    internal;
    set $office_gate_upstream http://backend:8000;
    proxy_pass $office_gate_upstream/office/gate;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header Cookie $http_cookie;
}

location @office_denied {
    default_type text/plain;
    return 401 "認証が必要です\n";
}

location /office-ui/ {
    auth_request /_office_gate;
    error_page 403 = @office_denied;

    set $office_upstream http://office:8080;
    rewrite ^/office-ui/(.*)$ /$1 break;
    proxy_pass $office_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_hide_header X-Frame-Options;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
}
