# World Monitor（profile worldmonitor）。ソースは同梱しない。
# 公開イメージはルートパス前提なので、ここで /worldmonitor-ui/ に載せ替える。
# 入場は HttpOnly クッキー。iframe は Authorization を付けられない。

location = /sw.js {
    default_type text/plain;
    return 404;
}

location = /_worldmonitor_gate {
    internal;
    set $wm_gate_upstream http://backend:8000;
    proxy_pass $wm_gate_upstream/worldmonitor/gate;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header Cookie $http_cookie;
}

location @worldmonitor_denied {
    default_type text/plain;
    return 401 "認証が必要です\n";
}

location /worldmonitor-ui/ {
    auth_request /_worldmonitor_gate;
    error_page 403 = @worldmonitor_denied;

    set $wm_upstream http://worldmonitor:8080;
    rewrite ^/worldmonitor-ui/(.*)$ /$1 break;
    proxy_pass $wm_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade           $http_upgrade;
    proxy_set_header Connection        $connection_upgrade;
    proxy_set_header Accept-Encoding   "";
    # 同じファイル名のまま中身を書き換える。immutable のまま残すと、地図の修正がブラウザに届かない。
    proxy_hide_header Cache-Control;
    add_header Cache-Control "no-cache" always;
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;
    proxy_cookie_path / /worldmonitor-ui/;
    proxy_redirect ~*^https?://[^/]+/(.*)$ /worldmonitor-ui/$1;
    proxy_redirect / /worldmonitor-ui/;

    sub_filter_once off;
    sub_filter_types application/javascript text/javascript text/css application/json;
    sub_filter '"/assets/' '"/worldmonitor-ui/assets/';
    sub_filter "'/assets/" "'/worldmonitor-ui/assets/";
    sub_filter '`/assets/' '`/worldmonitor-ui/assets/';
    sub_filter '"/api/' '"/worldmonitor-ui/api/';
    sub_filter "'/api/" "'/worldmonitor-ui/api/";
    sub_filter '`/api/' '`/worldmonitor-ui/api/';
    sub_filter '"/data/' '"/worldmonitor-ui/data/';
    sub_filter "'/data/" "'/worldmonitor-ui/data/";
    sub_filter '`/data/' '`/worldmonitor-ui/data/';
    sub_filter '"/textures/' '"/worldmonitor-ui/textures/';
    sub_filter "'/textures/" "'/worldmonitor-ui/textures/";
    sub_filter '`/textures/' '`/worldmonitor-ui/textures/';
    sub_filter '"/map-styles/' '"/worldmonitor-ui/map-styles/';
    sub_filter "'/map-styles/" "'/worldmonitor-ui/map-styles/";
    sub_filter '`/map-styles/' '`/worldmonitor-ui/map-styles/';
    sub_filter '"/icons/' '"/worldmonitor-ui/icons/';
    sub_filter "'/icons/" "'/worldmonitor-ui/icons/";
    sub_filter '"/fonts/' '"/worldmonitor-ui/fonts/';
    sub_filter "'/fonts/" "'/worldmonitor-ui/fonts/";
    sub_filter '/favico/' '/worldmonitor-ui/favico/';
    # 上流の Clerk ボタンと、フッターの外部リンク・ダウンロードは自己ホストでは出さない。
    sub_filter '<!-- Primary Meta Tags -->' '<!-- Primary Meta Tags --><style>.auth-signin-btn,.auth-signup-link,.auth-header-skeleton-signin,.auth-header-skeleton-signup,.copy-link-btn,.site-footer nav{display:none!important}.header{overflow:hidden}.variant-switcher{align-self:center!important;height:auto!important;max-height:28px;overflow:hidden;box-sizing:border-box}.variant-option .variant-label{white-space:nowrap}</style>';
    sub_filter 'url(/assets/' 'url(/worldmonitor-ui/assets/';
    sub_filter 'url(/textures/' 'url(/worldmonitor-ui/textures/';
    sub_filter 'url(/data/' 'url(/worldmonitor-ui/data/';
    sub_filter 'url(/map-styles/' 'url(/worldmonitor-ui/map-styles/';
    sub_filter 'register("/sw.js", { scope: "/" })' 'register("/worldmonitor-ui/sw.js", { scope: "/worldmonitor-ui/" })';
    sub_filter "register('/sw.js', { scope: '/' })" "register('/worldmonitor-ui/sw.js', { scope: '/worldmonitor-ui/' })";
    sub_filter 'register("/sw.js",{scope:"/"})' 'register("/worldmonitor-ui/sw.js",{scope:"/worldmonitor-ui/"})';
    # Vite の事前読み込みは実行時に "/" を足す。ファイル上は "assets/..." なので、上の "/assets/" 置換では届かない。
    sub_filter 'function(e){return"/"+e}' 'function(e){return"/worldmonitor-ui/"+e}';
    sub_filter '"/mapbox-gl-rtl-text.min.js"' '"/worldmonitor-ui/mapbox-gl-rtl-text.min.js"';
    # 公開サイトの別ホストへ飛ばさず、この画面の中で種類を切り替える。
    sub_filter 'location.hostname==="localhost"||location.hostname==="127.0.0.1"' 'location.hostname==="localhost"||location.hostname==="127.0.0.1"||true';
    sub_filter 'if(t==="localhost"||t==="127.0.0.1"){const n=Bt()' 'if(true){const n=Bt()';
    sub_filter "h==='localhost'||h==='127.0.0.1'" "h==='localhost'||h==='127.0.0.1'||true";
}
