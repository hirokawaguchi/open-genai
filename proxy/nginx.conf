# Open GENAI 本番用リバースプロキシ（TLS を一元終端）。
#
# LGWAN ではユーザ側に通せるのは 80/443 のみ。本プロキシだけが 80/443 を公開し、
# web / backend / keycloak は同一オリジン配下にパスでマッピングして集約する。
#   /      -> web (Vite)          ブラウザの SPA
#   /api/  -> backend:8000 (prefix 除去)  API・SAML SP・ファイル配信
#   /kc/   -> keycloak:8080 (relative /kc) SAML IdP
#
# HTTP のみ（自己署名不要）の閉域検証は proxy/nginx.verify.conf +
# docker-compose.verify.yml を使用する。
#
# 証明書は /etc/nginx/certs/{fullchain.pem,privkey.pem} をマウントする。

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    server_tokens off;

    # 添付ファイルのアップロード上限（必要に応じて調整）
    client_max_body_size 64m;

    # 入口レート制限（LGWAN 内の連打・スキャン緩和）
    limit_req_zone $binary_remote_addr zone=kc_login:10m rate=5r/s;
    limit_req_zone $binary_remote_addr zone=api_auth:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=api_files:10m rate=20r/s;

    # WebSocket(Upgrade) 用（Vite HMR 等）
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # --- HTTP(80) は HTTPS(443) へ強制リダイレクト ---
    server {
        listen 80;
        listen [::]:80;
        server_name _;
        return 301 https://$host$request_uri;
    }

    # --- HTTPS(443): TLS 終端 & パスルーティング ---
    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        http2 on;
        server_name _;

        ssl_certificate     /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;

        # セキュリティヘッダ（必要に応じて調整）
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;

        # Docker 内蔵 DNS。上流の名前解決をリクエスト時に遅延させ、
        # 起動順の前後で proxy が落ちないようにする（未起動時は 502 を返す）。
        resolver 127.0.0.11 valid=30s ipv6=off;

        # --- OpenAPI（本番では遮断）---
        location = /api/docs { return 404; }
        location ^~ /api/docs/ { return 404; }
        location = /api/redoc { return 404; }
        location ^~ /api/redoc/ { return 404; }
        location = /api/openapi.json { return 404; }

        # --- 添付 files（レート制限）---
        location ^~ /api/files/ {
            limit_req zone=api_files burst=40 nodelay;
            set $backend_upstream http://backend:8000;
            rewrite ^/api/(.*)$ /$1 break;
            proxy_pass $backend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Host  $host;
            proxy_set_header X-Forwarded-Port  443;
            proxy_set_header X-Forwarded-Prefix /api;
            proxy_buffering    off;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            client_max_body_size 64m;
        }

        # --- SAML 認証開始（レート制限）---
        location ^~ /api/auth/ {
            limit_req zone=api_auth burst=20 nodelay;
            set $backend_upstream http://backend:8000;
            rewrite ^/api/(.*)$ /$1 break;
            proxy_pass $backend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Host  $host;
            proxy_set_header X-Forwarded-Port  443;
            proxy_set_header X-Forwarded-Prefix /api;
            proxy_buffering    off;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # --- backend API（/api を除去して backend ルートへ）---
        location /api/ {
            set $backend_upstream http://backend:8000;
            rewrite ^/api/(.*)$ /$1 break;
            proxy_pass $backend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Host  $host;
            proxy_set_header X-Forwarded-Port  443;
            proxy_set_header X-Forwarded-Prefix /api;
            # 推論ストリーム(SSE/NDJSON)のためバッファ無効・長時間タイムアウト
            proxy_buffering    off;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # --- Keycloak（relative path /kc をそのまま維持）---
        # Keycloak が /kc 無しの SAML URL を返した場合の救済
        location /realms/ {
            return 302 $scheme://$host/kc$request_uri;
        }

        # 管理コンソールの静的 JS/CSS。ログイン用レート制限の対象外にする。
        location ^~ /kc/resources/ {
            set $kc_upstream http://keycloak:8080;
            proxy_pass $kc_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Host  $host;
            proxy_set_header X-Forwarded-Port  443;
            proxy_set_header X-Forwarded-Prefix /kc;
        }

        # 管理コンソールは既定で全拒否。許可 CIDR は kc-admin-allow.conf に追記。
        location ^~ /kc/admin {
            include /etc/nginx/kc-admin-allow.conf;
            include /etc/nginx/kc-admin-allow.d/*.conf;
            deny all;
            set $kc_upstream http://keycloak:8080;
            proxy_pass $kc_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Host  $host;
            proxy_set_header X-Forwarded-Port  443;
            proxy_set_header X-Forwarded-Prefix /kc;
        }

        location /kc/ {
            limit_req zone=kc_login burst=10 nodelay;
            set $kc_upstream http://keycloak:8080;
            proxy_pass $kc_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Host  $host;
            proxy_set_header X-Forwarded-Port  443;
            proxy_set_header X-Forwarded-Prefix /kc;
        }

        # --- SeaweedFS(S3) 成果物の署名付きURL配信 ---
        # 8333 を直接公開せず、単一入口(nginx)経由で成果物を配信する構成の場合に使用する。
        # 署名URLは backend の S3_PUBLIC_ENDPOINT を基に生成されるため、
        # S3_PUBLIC_ENDPOINT にこのドメイン（例 https://<host>）を設定すること。
        # パスは S3_BUCKET（既定 open-genai）に一致させる。
        location /open-genai/ {
            set $s3_upstream http://seaweedfs:8333;
            proxy_pass $s3_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_buffering off;
            client_max_body_size 64m;
        }

        # --- フロントエンド（静的ビルド / nginx）---
        location / {
            set $web_upstream http://web:80;
            proxy_pass $web_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }
    }
}
