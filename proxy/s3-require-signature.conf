# 署名のない S3 リクエストを 403 にする。公開バケットの location から include する。
# ブラウザの受取はクエリの X-Amz-Signature。サーバからの操作は Authorization。
# 署名が正しいかは後段のストレージが判定する。
set $s3_ok 0;
if ($http_authorization ~* "^AWS4-HMAC-SHA256 ") {
    set $s3_ok 1;
}
if ($http_authorization ~* "^AWS ") {
    set $s3_ok 1;
}
if ($args ~* "(^|&)X-Amz-Signature=") {
    set $s3_ok 1;
}
if ($args ~* "(^|&)Signature=") {
    set $s3_ok 1;
}
if ($s3_ok = 0) {
    return 403;
}
