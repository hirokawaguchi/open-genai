# Keycloak 管理コンソール (/kc/admin) への到達を許可する CIDR を列挙する。
# 未記載のままでは nginx.conf 側の `deny all` により全拒否（推奨既定）。
#
# サイト固有の許可は proxy/kc-admin-allow.d/10-local.conf に書く（gitignore）。
# 管理網からのみ許可する例:
#   allow 10.0.0.0/8;
#   allow 192.168.0.0/16;
#
# このファイルを編集したら proxy コンテナを再読込すること:
#   docker compose exec proxy nginx -s reload
