# Open GENAI 本番スタックの HTTP 検証/閉域運用用リバースプロキシ（TLS 不要）。
#
# docker-compose.prod.yml（静的ビルドの web を nginx で :80 配信）を、TLS/自己署名
# 証明書を使わずポート 80 のみで検証・閉域運用するための設定。dev 用の
# proxy/nginx.http.conf（web = Vite dev server:5173）とは web の上流だけが異なる。
#   /      -> web (静的ビルド nginx):80   ブラウザの SPA
#   /api/  -> backend:8000 (prefix 除去)  API・SAML SP・ファイル配信
#   /kc/   -> keycloak:8080 (relative /kc) SAML IdP
#
# 本番 TLS 終端は proxy/nginx.conf を使用する。

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    server_tokens off;

    client_max_body_size 64m;

    limit_req_zone $binary_remote_addr zone=kc_login:10m rate=5r/s;
    limit_req_zone $binary_remote_addr zone=api_auth:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=api_files:10m rate=20r/s;

    server {
        listen 80;
        listen [::]:80;
        server_name _;

        resolver 127.0.0.11 valid=30s ipv6=off;

        location = /api/docs { return 404; }
        location ^~ /api/docs/ { return 404; }
        location = /api/redoc { return 404; }
        location ^~ /api/redoc/ { return 404; }
        location = /api/openapi.json { return 404; }

        location ^~ /api/files/ {
            limit_req zone=api_files burst=40 nodelay;
            set $backend_upstream http://backend:8000;
            rewrite ^/api/(.*)$ /$1 break;
            proxy_pass $backend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host  $host;
            proxy_set_header X-Forwarded-Prefix /api;
            proxy_buffering    off;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            client_max_body_size 64m;
        }

        location ^~ /api/auth/ {
            limit_req zone=api_auth burst=20 nodelay;
            set $backend_upstream http://backend:8000;
            rewrite ^/api/(.*)$ /$1 break;
            proxy_pass $backend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host  $host;
            proxy_set_header X-Forwarded-Prefix /api;
            proxy_buffering    off;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        location /api/ {
            set $backend_upstream http://backend:8000;
            rewrite ^/api/(.*)$ /$1 break;
            proxy_pass $backend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host  $host;
            proxy_set_header X-Forwarded-Prefix /api;
            proxy_buffering    off;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # Keycloak が /kc 無しの SAML URL を返した場合の救済
        location /realms/ {
            return 302 $scheme://$host/kc$request_uri;
        }

        # 管理コンソールの静的 JS/CSS。ログイン用レート制限の対象外にする。
        location ^~ /kc/resources/ {
            set $kc_upstream http://keycloak:8080;
            proxy_pass $kc_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host  $host;
            proxy_set_header X-Forwarded-Port  $server_port;
            proxy_set_header X-Forwarded-Prefix /kc;
        }

        location ^~ /kc/admin {
            include /etc/nginx/kc-admin-allow.conf;
            include /etc/nginx/kc-admin-allow.d/*.conf;
            deny all;
            set $kc_upstream http://keycloak:8080;
            proxy_pass $kc_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host  $host;
            proxy_set_header X-Forwarded-Port  $server_port;
            proxy_set_header X-Forwarded-Prefix /kc;
        }

        location /kc/ {
            limit_req zone=kc_login burst=10 nodelay;
            set $kc_upstream http://keycloak:8080;
            proxy_pass $kc_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host  $host;
            proxy_set_header X-Forwarded-Port  $server_port;
            proxy_set_header X-Forwarded-Prefix /kc;
        }

        # 閉域検証: 日程調整のゲスト面を本体と同じホストで出す。
        # 本番の外部公開は別プロキシ（proxy/chosei.public.conf.example）を使う。
        location ^~ /public/e/ {
            set $chosei_upstream http://chosei-app:8010;
            proxy_pass $chosei_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        location ^~ /public/api/events/ {
            set $chosei_upstream http://chosei-app:8010;
            proxy_pass $chosei_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        location ^~ /public/assets/ {
            set $chosei_upstream http://chosei-app:8010;
            proxy_pass $chosei_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
        }

        # --- フロントエンド（静的ビルド / nginx）---
        location / {
            set $web_upstream http://web:80;
            proxy_pass $web_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
