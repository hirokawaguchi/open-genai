# Open GENAI: デジタル庁 源内 (genai-web) をローカル LLM (Ollama) で動かす構成
#
#   [ブラウザ] -> proxy (:80) -> web / backend / keycloak（同一オリジン）
#                                    └-> Ollama (11434)
#
# ユーザ公開は proxy の HTTP(80) のみ。web/backend/keycloak は内部ネットワークのみ。
# ポート変更: .env の PROXY_HTTP_PORT（例: 8080）。PUBLIC_URL も合わせて変更すること。
#
# Ollama は既定でホスト側 (host.docker.internal:11434) を利用する。
# Ollama もコンテナで動かしたい場合は `--profile ollama` を付けて起動する。

services:
  # 唯一の公開点: HTTP で /、/api/、/kc/ を内部サービスへ振り分ける
  proxy:
    image: nginx:1.27-alpine
    container_name: open-genai-proxy
    ports:
      - "${PROXY_HTTP_PORT:-80}:80"
    volumes:
      - ./proxy/nginx.http.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - web
      - backend
      - keycloak
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        PII_INSTALL_NER: ${PII_INSTALL_NER:-0}
    container_name: open-genai-backend
    expose:
      - "8000"
    environment:
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      # OpenAI 互換エンドポイント（未指定なら OLLAMA_BASE_URL/v1 を使用）
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-ollama}
      - DEFAULT_MODEL=${DEFAULT_MODEL:-qwen2.5:7b}
      - LLM_PROVIDERS=${LLM_PROVIDERS:-}
      - DB_PATH=/data/open-genai.db
      # --- 監査ログ（8-(1)）/ チャット履歴ユーザー別分離（6-(8)）---
      - AUDIT_ENABLED=${AUDIT_ENABLED:-true}
      - AUDIT_DB_PATH=/data/audit.db
      - AUDIT_STORE_CONTENT=${AUDIT_STORE_CONTENT:-true}
      - AUDIT_MAX_CONTENT_CHARS=${AUDIT_MAX_CONTENT_CHARS:-8000}
      - AUDIT_RETENTION_DAYS=${AUDIT_RETENTION_DAYS:-1825}
      - LEGACY_CHAT_OWNER=${LEGACY_CHAT_OWNER:-}
      # RAG「AI アプリ」連携先（Team API がここへプロキシする）
      - RAG_APP_URL=${RAG_APP_URL:-http://rag-app:8001/invoke}
      - RAG_API_KEY=${RAG_API_KEY:-local-rag-key}
      # 監査ログ参照「AI アプリ」連携先（管理者限定）
      - AUDIT_APP_URL=${AUDIT_APP_URL:-http://audit-app:8005/invoke}
      # 利用者一括管理「AI アプリ」連携先（管理者限定）
      - USERMGMT_APP_URL=${USERMGMT_APP_URL:-http://usermgmt-app:8006/invoke}
      # モデル利用制御「AI アプリ」連携先（管理者限定）と参照するポリシーDB
      - MODELPOLICY_APP_URL=${MODELPOLICY_APP_URL:-http://modelpolicy-app:8007/invoke}
      - POLICY_DB_PATH=/data/policy.db
      # 入力制限(禁止ワード/機密情報)「AI アプリ」連携先と参照するルールDB
      - NGWORD_APP_URL=${NGWORD_APP_URL:-http://ngword-app:8008/invoke}
      - NGWORD_DB_PATH=/data/ngwords.db
      # プロンプトテンプレート「AI アプリ」連携先（全ユーザー利用可）
      - PROMPT_APP_URL=${PROMPT_APP_URL:-http://prompt-app:8009/invoke}
      # 日程調整（profiles: ["chosei"] で起動。未起動時は専用ページが案内を表示）
      - CHOSEI_APP_URL=${CHOSEI_APP_URL:-http://chosei-app:8010/invoke}
      - CHOSEI_PUBLIC_ENDPOINT=${CHOSEI_PUBLIC_ENDPOINT:-http://localhost:8010}
      # 書類領域分割チェック（profiles: ["doccheck"]）
      - DOCCHECK_APP_URL=${DOCCHECK_APP_URL:-http://doccheck-app:8011/invoke}
      - DOCCHECK_PUBLIC_ENDPOINT=${DOCCHECK_PUBLIC_ENDPOINT:-http://localhost:8011}
      # フォーム（profiles: ["patchform"] で起動。未起動時は専用ページが案内を表示）
      - PATCHFORM_APP_URL=${PATCHFORM_APP_URL:-http://patchform-app:8012/invoke}
      - PATCHFORM_PUBLIC_ENDPOINT=${PATCHFORM_PUBLIC_ENDPOINT:-http://localhost:8012}
      - PATCHFORM_SERVICE_KEY=${PATCHFORM_SERVICE_KEY:-}
      # 内部サービス間署名の共有鍵（x-user-* 偽装対策）。全 exApp と同一値。本番は必ず変更。
      - INTERNAL_SIGNING_SECRET=${INTERNAL_SIGNING_SECRET:-dev-internal-secret-change-me}
      # 成果物取得(SSRF 対策): 許可ホスト(カンマ区切り, 空=内部宛先のみ拒否)とサイズ上限
      - ARTIFACT_FETCH_ALLOWED_HOSTS=${ARTIFACT_FETCH_ALLOWED_HOSTS:-}
      - ARTIFACT_MAX_BYTES=${ARTIFACT_MAX_BYTES:-52428800}
      # 成果物ファイルの再ホスト先（自前 S3 互換: SeaweedFS）
      - S3_ENDPOINT_URL=${S3_ENDPOINT_URL:-http://seaweedfs:8333}
      - S3_PUBLIC_ENDPOINT=${S3_PUBLIC_ENDPOINT:-http://localhost:8333}
      - S3_BUCKET=${S3_BUCKET:-open-genai}
      - S3_ACCESS_KEY=${S3_ACCESS_KEY:-opengenai}
      - S3_SECRET_KEY=${S3_SECRET_KEY:-opengenai-secret}
      - S3_PRESIGN_EXPIRY=${S3_PRESIGN_EXPIRY:-86400}
      - S3_ARTIFACT_RETENTION_DAYS=${S3_ARTIFACT_RETENTION_DAYS:-30}
      - S3_ARTIFACT_PURGE_INTERVAL=${S3_ARTIFACT_PURGE_INTERVAL:-86400}
      # 成果物の配信方式（open=直接リンク / carrier=リンクファイル持ち出し。LGWAN 等は carrier）
      - ARTIFACT_DELIVERY_MODE=${ARTIFACT_DELIVERY_MODE:-open}
      - ARTIFACT_CARRIER_FORMAT=${ARTIFACT_CARRIER_FORMAT:-txt}
      # Dify 連携「AI アプリ」プロキシの endpoint（アプリ登録時の endpoint に使う）
      - DIFY_APP_URL=${DIFY_APP_URL:-http://dify-app:8004/invoke}
      # 源内 Web「画像を生成」ページ (/image/generate) 用 SD サーバ
      # SD_BACKEND: a1111（既定・GPU 自前運用）| fastsd（CPU-only, FastSD を外部起動）
      - SD_BACKEND=${SD_BACKEND:-a1111}
      # 未設定なら a1111=:7860 / fastsd=:8000 が既定。明示すればそれを優先。
      - SD_API_URL=${SD_API_URL:-}
      - SD_TIMEOUT=${SD_TIMEOUT:-600}
      # FastSD 用モデル設定（SD_BACKEND=fastsd のときのみ有効）
      - SD_FASTSD_USE_OPENVINO=${SD_FASTSD_USE_OPENVINO:-false}
      - SD_FASTSD_USE_LCM_LORA=${SD_FASTSD_USE_LCM_LORA:-false}
      - SD_FASTSD_USE_TINY_AUTO_ENCODER=${SD_FASTSD_USE_TINY_AUTO_ENCODER:-false}
      - SD_FASTSD_USE_SAFETY_CHECKER=${SD_FASTSD_USE_SAFETY_CHECKER:-false}
      - SD_FASTSD_MODEL_ID=${SD_FASTSD_MODEL_ID:-}
      - SD_FASTSD_OPENVINO_MODEL_ID=${SD_FASTSD_OPENVINO_MODEL_ID:-}
      # --- SAML 認証 (backend = SAML SP) ---
      - APP_JWT_SECRET=${APP_JWT_SECRET:-change-me-open-genai-secret}
      # 起動時の既定パスワード警告用（未変更なら stderr にガイドを出す）
      - KEYCLOAK_ADMIN_PASSWORD=${KEYCLOAK_ADMIN_PASSWORD:-admin}
      - FILES_URL_SECRET=${FILES_URL_SECRET:-}
      # proxy 経由の公開 URL（末尾スラッシュ無し。PROXY_HTTP_PORT 変更時は合わせる）
      - PUBLIC_BASE_URL=${PUBLIC_URL:-http://localhost}/api
      - FRONTEND_URL=${PUBLIC_URL:-http://localhost}
      - SAML_SP_ENTITY_ID=${PUBLIC_URL:-http://localhost}/api/auth/saml/metadata
      - SAML_SP_ACS_URL=${PUBLIC_URL:-http://localhost}/api/auth/saml/acs
      - SAML_SP_SLS_URL=${PUBLIC_URL:-http://localhost}/api/auth/saml/sls
      # backend(コンテナ内)から IdP メタデータを取得する URL（Keycloak relative /kc）
      - SAML_IDP_METADATA_URL=${SAML_IDP_METADATA_URL:-http://keycloak:8080/kc/realms/open-genai/protocol/saml/descriptor}
    volumes:
      - backend_data:/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      rag-app:
        condition: service_started
      whisper-app:
        condition: service_started
      dify-app:
        condition: service_started
      audit-app:
        condition: service_started
      usermgmt-app:
        condition: service_started
      modelpolicy-app:
        condition: service_started
      ngword-app:
        condition: service_started
      prompt-app:
        condition: service_started
      seaweedfs:
        condition: service_healthy
      keycloak:
        condition: service_started
    restart: unless-stopped

  # SAML IdP（ユーザー管理 UI 付き）
  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    container_name: open-genai-keycloak
    command: ["start-dev", "--import-realm", "--spi-import-export-importStrategy=OVERWRITE_EXISTING"]
    environment:
      - KC_BOOTSTRAP_ADMIN_USERNAME=${KEYCLOAK_ADMIN:-admin}
      - KC_BOOTSTRAP_ADMIN_PASSWORD=${KEYCLOAK_ADMIN_PASSWORD:-admin}
      # 公開 URL は proxy の /kc。フル URL で指定しないと SAML メタデータに /kc が付かない
      - KC_HOSTNAME=${PUBLIC_URL:-http://localhost}/kc
      - KC_HTTP_RELATIVE_PATH=/kc
      - KC_HOSTNAME_STRICT=false
      - KC_HTTP_ENABLED=true
      - KC_PROXY_HEADERS=xforwarded
    expose:
      - "8080"
    volumes:
      - ./keycloak/import:/opt/keycloak/data/import:ro
      - keycloak_data:/opt/keycloak/data
    restart: unless-stopped

  # RAG を「行政実務用 AI アプリ」として提供するマイクロサービス
  rag-app:
    build:
      context: .
      dockerfile: rag-app/Dockerfile
      args:
        PII_INSTALL_NER: ${PII_INSTALL_NER:-0}
    container_name: open-genai-rag-app
    environment:
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-ollama}
      - QDRANT_URL=http://qdrant:6333
      - QDRANT_COLLECTION=${QDRANT_COLLECTION:-open_genai_rag}
      - EMBED_MODEL=${EMBED_MODEL:-mxbai-embed-large}
      - EMBED_DIM=${EMBED_DIM:-1024}
      - EMBED_BASE_URL=${EMBED_BASE_URL:-}
      - EMBED_API_KEY=${EMBED_API_KEY:-}
      - "EMBED_QUERY_PREFIX=${EMBED_QUERY_PREFIX-Represent this sentence for searching relevant passages: }"
      - "EMBED_DOC_PREFIX=${EMBED_DOC_PREFIX-}"
      - RAG_MODEL=${RAG_MODEL:-gpt-oss:20b}
      - RAG_EXTRA_BODY=${RAG_EXTRA_BODY:-}
      - RAG_API_KEY=${RAG_API_KEY:-local-rag-key}
      # 内部サービス間署名の共有鍵（backend と同一値。x-user-*/x-scope 偽装対策）
      - INTERNAL_SIGNING_SECRET=${INTERNAL_SIGNING_SECRET:-dev-internal-secret-change-me}
      # URL メタ情報レジストリ(SQLite)
      - RAG_META_DB_PATH=/data/rag_meta.db
      # URL 取り込みの自動更新間隔（秒。既定1日）
      - URL_REFRESH_INTERVAL=${URL_REFRESH_INTERVAL:-86400}
      # URL 取り込みの SSRF 対策: 許可ホスト(カンマ区切り, 空=内部宛先のみ拒否)
      - URL_FETCH_ALLOWED_HOSTS=${URL_FETCH_ALLOWED_HOSTS:-}
      # 入力制限ルール（添付警告・ナレッジ PII）を backend と共有
      - NGWORD_DB_PATH=/ngword-data/ngwords.db
    volumes:
      - rag_app_data:/data
      - backend_data:/ngword-data:ro
    # Dify 等の外部コンテナから host.docker.internal:8001 で Retrieval API を叩けるように公開
    ports:
      - "${RAG_APP_PORT:-8001}:8001"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - qdrant
    restart: unless-stopped

  # ナレッジ検索 MCP（Dify Agent 等向け Streamable HTTP）
  # エンドポイント: http://host.docker.internal:8002/mcp
  knowledge-mcp:
    build: ./knowledge-mcp
    container_name: open-genai-knowledge-mcp
    environment:
      - RAG_BASE_URL=${RAG_BASE_URL:-http://rag-app:8001}
      - RAG_API_KEY=${RAG_API_KEY:-local-rag-key}
      - RAG_DEFAULT_SCOPE=${RAG_DEFAULT_SCOPE:-00000000-0000-0000-0000-000000000000}
      - MCP_HOST=0.0.0.0
      - MCP_PORT=8002
    ports:
      # 注意: knowledge-mcp は無認証で、scope(teamId) は呼び出し側が任意指定できる。
      # つまり到達できれば全チームのナレッジを読み出せる。
      # 当面は同一サーバ上の Dify のみ想定のため既定は 127.0.0.1。
      # compose 内の他サービスは http://knowledge-mcp:8002 で到達（ホスト公開不要）。
      - "${KNOWLEDGE_MCP_BIND:-127.0.0.1}:${KNOWLEDGE_MCP_PORT:-8002}:8002"
    depends_on:
      - rag-app
    restart: unless-stopped

  # ベクトルデータベース
  qdrant:
    image: qdrant/qdrant:latest
    container_name: open-genai-qdrant
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

  # 文字起こしを「AI アプリ」として提供（faster-whisper / CPU）。GPU 実装は環境側で差し替え。
  whisper-app:
    build: ./whisper-app
    container_name: open-genai-whisper-app
    environment:
      - RAG_API_KEY=${RAG_API_KEY:-local-rag-key}
      - WHISPER_MODEL=${WHISPER_MODEL:-medium}
      - WHISPER_DEVICE=${WHISPER_DEVICE:-cpu}
      - WHISPER_COMPUTE=${WHISPER_COMPUTE:-int8}
    volumes:
      - whisper_cache:/cache
    restart: unless-stopped

  # Dify(ワークフロー/チャットフロー)連携を「AI アプリ」として提供する汎用プロキシ
  # 接続先(base_url)・種別は AI アプリの設定(config) でアプリ単位に指定する。
  dify-app:
    build: ./dify-app
    container_name: open-genai-dify-app
    environment:
      - RAG_API_KEY=${RAG_API_KEY:-local-rag-key}
      # 既定の Dify 接続先（任意。各 AI アプリの config で個別に上書き可能）
      - DIFY_BASE_URL=${DIFY_BASE_URL:-}
    volumes:
      # session_id -> conversation_id の対応（会話継続用）を永続化
      - dify_app_data:/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  # 監査ログ参照を「AI アプリ」として提供（管理者限定）。
  # backend と同じ backend_data ボリュームを共有し、audit.db を読み取り専用で参照する。
  audit-app:
    build: ./audit-app
    container_name: open-genai-audit-app
    environment:
      - RAG_API_KEY=${RAG_API_KEY:-local-rag-key}
      - AUDIT_DB_PATH=/data/audit.db
      - INTERNAL_SIGNING_SECRET=${INTERNAL_SIGNING_SECRET:-dev-internal-secret-change-me}
    volumes:
      # backend の監査DBを共有（WAL の -shm 参照のため rw マウント。接続は mode=ro）
      - backend_data:/data
    restart: unless-stopped

  # 利用者一括管理を「AI アプリ」として提供（管理者限定）。Keycloak Admin API と連携。
  usermgmt-app:
    build: ./usermgmt-app
    container_name: open-genai-usermgmt-app
    environment:
      - RAG_API_KEY=${RAG_API_KEY:-local-rag-key}
      - KEYCLOAK_URL=${KEYCLOAK_INTERNAL_URL:-http://keycloak:8080/kc}
      - KEYCLOAK_REALM=${KEYCLOAK_REALM:-open-genai}
      - KEYCLOAK_ADMIN=${KEYCLOAK_ADMIN:-admin}
      - KEYCLOAK_ADMIN_PASSWORD=${KEYCLOAK_ADMIN_PASSWORD:-admin}
      - INTERNAL_SIGNING_SECRET=${INTERNAL_SIGNING_SECRET:-dev-internal-secret-change-me}
    depends_on:
      - keycloak
    restart: unless-stopped

  # モデル利用制御を「AI アプリ」として提供（管理者限定）。
  # backend_data を共有し policy.db の唯一のライターとして動作（backend は読取専用）。
  modelpolicy-app:
    build: ./modelpolicy-app
    container_name: open-genai-modelpolicy-app
    environment:
      - RAG_API_KEY=${RAG_API_KEY:-local-rag-key}
      - POLICY_DB_PATH=/data/policy.db
      - INTERNAL_SIGNING_SECRET=${INTERNAL_SIGNING_SECRET:-dev-internal-secret-change-me}
    volumes:
      - backend_data:/data
    restart: unless-stopped

  # 入力制限(禁止ワード/機密情報)を「AI アプリ」として提供（管理者限定）。
  # backend_data を共有し ngwords.db の唯一のライターとして動作（backend は読取専用）。
  ngword-app:
    build: ./ngword-app
    container_name: open-genai-ngword-app
    environment:
      - RAG_API_KEY=${RAG_API_KEY:-local-rag-key}
      - NGWORD_DB_PATH=/data/ngwords.db
      - INTERNAL_SIGNING_SECRET=${INTERNAL_SIGNING_SECRET:-dev-internal-secret-change-me}
    volumes:
      - backend_data:/data
    restart: unless-stopped

  # プロンプトテンプレートを「AI アプリ」として提供（全ユーザー利用可）。
  prompt-app:
    build: ./prompt-app
    container_name: open-genai-prompt-app
    environment:
      - RAG_API_KEY=${RAG_API_KEY:-local-rag-key}
      - PROMPT_DB_PATH=/data/prompts.db
      - INTERNAL_SIGNING_SECRET=${INTERNAL_SIGNING_SECRET:-dev-internal-secret-change-me}
    volumes:
      - backend_data:/data
    restart: unless-stopped

  # 成果物ファイル配信用の自前オブジェクトストレージ（OSS・S3互換）。
  # マネージドサービスを使わない方針に沿い、SeaweedFS を同梱する。
  seaweedfs:
    image: chrislusf/seaweedfs:latest
    container_name: open-genai-seaweedfs
    command: >-
      server -dir=/data -s3 -s3.port=8333
      -s3.config=/etc/seaweedfs/s3.config.json -ip.bind=0.0.0.0
    ports:
      # dev: 署名付き URL をホストのブラウザから検証できるよう公開（本番は非公開＋別途配信）
      - "8333:8333"
    volumes:
      - seaweedfs_data:/data
      - ./seaweedfs/s3.config.json:/etc/seaweedfs/s3.config.json:ro
    healthcheck:
      # S3 API は起動直後 listen しない。403 も「応答あり」として healthy 扱う。
      # BusyBox wget は 403 で終了コード 8 ではなく 1 を返すため、HTTP ステータスで判定する。
      test: ["CMD-SHELL", "wget -S --spider http://127.0.0.1:8333/ 2>&1 | grep -qE 'HTTP/.* (403|200)'"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 25s
    restart: unless-stopped

  web:
    build:
      context: ./genai-web
      dockerfile: Dockerfile.local
    container_name: open-genai-web
    expose:
      - "5173"
    environment:
      - VITE_USE_POLLING=true
      # proxy 経由の相対 API パス（genai-web 無改修）
      - VITE_APP_API_ENDPOINT=/api
      - VITE_APP_TEAM_ACCESS_CONTROL_API_ENDPOINT=/api
      - VITE_APP_TITLE=${VITE_APP_TITLE:-Open GENAI}
      - VITE_ALLOWED_HOSTS=${VITE_ALLOWED_HOSTS:-true}
    volumes:
      - ./genai-web:/app
      # ルート / 各ワークスペースの node_modules はバインドマウントで隠れないよう
      # 名前付きボリュームで保持する（イメージ内の内容で初期化される）。
      - web_node_modules:/app/node_modules
      - web_pkg_web_node_modules:/app/packages/web/node_modules
      - web_pkg_common_node_modules:/app/packages/common/node_modules
      - web_pkg_types_node_modules:/app/packages/types/node_modules
      - web_pkg_cdk_node_modules:/app/packages/cdk/node_modules
    depends_on:
      - backend
    restart: unless-stopped

  # 任意: Ollama もコンテナで動かす場合 (`docker compose --profile ollama up`)
  ollama:
    image: ollama/ollama:latest
    container_name: open-genai-ollama
    profiles: ["ollama"]
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped

  # 任意: 日程調整 (`docker compose --profile chosei up -d` または COMPOSE_PROFILES=chosei)
  # 庁内は backend → 本サービス。外部ゲストは CHOSEI_PUBLIC_ENDPOINT（開発時は :8010）へ。
  # 本番の外部公開は /public のみを別プロキシで露出すること（proxy/chosei.public.conf.example）。
  chosei-app:
    profiles: ["chosei"]
    build: ./chosei-app
    container_name: open-genai-chosei-app
    environment:
      - RAG_API_KEY=${RAG_API_KEY:-local-rag-key}
      - INTERNAL_SIGNING_SECRET=${INTERNAL_SIGNING_SECRET:-dev-internal-secret-change-me}
      - CHOSEI_DB_PATH=/data/chosei.db
      - CHOSEI_PUBLIC_ENDPOINT=${CHOSEI_PUBLIC_ENDPOINT:-http://localhost:8010}
      - CHOSEI_RETENTION_DAYS=${CHOSEI_RETENTION_DAYS:-90}
      # LLM アシスト（最適日提案・自然文日程・案内文）。未指定なら Ollama /v1
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-ollama}
      - CHOSEI_MODEL=${CHOSEI_MODEL:-${DEFAULT_MODEL:-qwen2.5:7b}}
      - CHOSEI_EXTRA_BODY=${CHOSEI_EXTRA_BODY:-}
      - APP_TITLE=${APP_TITLE:-${VITE_APP_TITLE:-Open GENAI}}
    volumes:
      - chosei_app_data:/data
    ports:
      # 開発用: ゲスト UI/API（/public）をホストから直接確認。本番はホスト公開せず別プロキシへ。
      - "${CHOSEI_PUBLIC_PORT:-8010}:8010"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  # 任意: 書類領域分割チェック (`docker compose --profile doccheck up -d`)
  # 庁内は backend → 本サービス。外部ゲストは DOCCHECK_PUBLIC_ENDPOINT（開発時は :8011）。
  # 本番の外部公開は /public のみを別プロキシで露出すること（proxy/doccheck.public.conf.example）。
  doccheck-app:
    profiles: ["doccheck"]
    build:
      context: ./doccheck-app
      args:
        # amd64 本番で本家 PaddleOCR を入れる場合: DOCCHECK_INSTALL_PADDLEOCR=1
        INSTALL_PADDLEOCR: ${DOCCHECK_INSTALL_PADDLEOCR:-0}
    container_name: open-genai-doccheck-app
    environment:
      - RAG_API_KEY=${RAG_API_KEY:-local-rag-key}
      - INTERNAL_SIGNING_SECRET=${INTERNAL_SIGNING_SECRET:-dev-internal-secret-change-me}
      - DOCCHECK_DB_PATH=/data/doccheck.db
      - DOCCHECK_DATA_DIR=/data
      - DOCCHECK_PUBLIC_ENDPOINT=${DOCCHECK_PUBLIC_ENDPOINT:-http://localhost:8011}
      # 手書き向け既定: hybrid = PP-OCR(本家→RapidOCR) → 低信頼時 Vision
      # paddleocr / paddle / vision / tesseract / none も可
      # 本家は amd64 + INSTALL_PADDLEOCR=1 時。未導入/arm64 は RapidOCR に自動フォールバック
      - DOCCHECK_OCR_ENGINE=${DOCCHECK_OCR_ENGINE:-hybrid}
      - DOCCHECK_VISION_MODEL=${DOCCHECK_VISION_MODEL:-gemma3:27b}
      - DOCCHECK_PADDLE_MIN_CONF=${DOCCHECK_PADDLE_MIN_CONF:-0.50}
      - DOCCHECK_PADDLEOCR_FORCE=${DOCCHECK_PADDLEOCR_FORCE:-0}
      - DOCCHECK_PADDLEOCR_LANG=${DOCCHECK_PADDLEOCR_LANG:-japan}
      - DOCCHECK_ASSIGNEES=${DOCCHECK_ASSIGNEES:-3}
      - DOCCHECK_OVERLAP_RATIO=${DOCCHECK_OVERLAP_RATIO:-0.08}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-ollama}
      - DEFAULT_MODEL=${DEFAULT_MODEL:-qwen2.5:7b}
      - APP_TITLE=${APP_TITLE:-${VITE_APP_TITLE:-Open GENAI}}
    volumes:
      - doccheck_app_data:/data
    ports:
      - "${DOCCHECK_PUBLIC_PORT:-8011}:8011"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  # 任意: フォーム (`docker compose --profile patchform up -d`)
  # 庁内は backend → 本サービス。外部ゲストは PATCHFORM_PUBLIC_ENDPOINT（開発時は :8012）。
  # 本番の外部公開は /public のみを別プロキシで露出すること（proxy/patchform.public.conf.example）。
  patchform-app:
    profiles: ["patchform"]
    build:
      context: .
      dockerfile: patchform-app/Dockerfile

    container_name: open-genai-patchform-app
    environment:
      - RAG_API_KEY=${RAG_API_KEY:-local-rag-key}
      - INTERNAL_SIGNING_SECRET=${INTERNAL_SIGNING_SECRET:-dev-internal-secret-change-me}
      - PATCHFORM_DB_PATH=/data/patchform.db
      - PATCHFORM_PUBLIC_ENDPOINT=${PATCHFORM_PUBLIC_ENDPOINT:-http://localhost:8012}
      - PATCHFORM_RETENTION_DAYS=${PATCHFORM_RETENTION_DAYS:-365}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-ollama}
      - PATCHFORM_MODEL=${PATCHFORM_MODEL:-${DEFAULT_MODEL:-qwen2.5:7b}}
      - PATCHFORM_VISION_MODEL=${PATCHFORM_VISION_MODEL:-${DOCCHECK_VISION_MODEL:-gemma3:12b}}
      - PATCHFORM_ENCRYPT_KEY=${PATCHFORM_ENCRYPT_KEY:-}
      - PATCHFORM_FILES_DIR=/data/files
      - PATCHFORM_MAX_UPLOAD_BYTES=${PATCHFORM_MAX_UPLOAD_BYTES:-10485760}
      - PATCHFORM_GBIZ_TOKEN=${PATCHFORM_GBIZ_TOKEN:-}
      - PATCHFORM_SEED=${PATCHFORM_SEED:-1}
      - APP_TITLE=${APP_TITLE:-${VITE_APP_TITLE:-Open GENAI}}
      - PATCHFORM_SMTP_HOST=${PATCHFORM_SMTP_HOST:-}
      - PATCHFORM_SMTP_PORT=${PATCHFORM_SMTP_PORT:-587}
      - PATCHFORM_SMTP_USER=${PATCHFORM_SMTP_USER:-}
      - PATCHFORM_SMTP_PASSWORD=${PATCHFORM_SMTP_PASSWORD:-}
      - PATCHFORM_SMTP_STARTTLS=${PATCHFORM_SMTP_STARTTLS:-1}
      - PATCHFORM_SMTP_SSL=${PATCHFORM_SMTP_SSL:-0}
      - PATCHFORM_SMTP_FROM=${PATCHFORM_SMTP_FROM:-}
      - PATCHFORM_STAFF_BASE_URL=${PATCHFORM_STAFF_BASE_URL:-${PUBLIC_URL:-http://localhost}}
      - PATCHFORM_SERVICE_KEY=${PATCHFORM_SERVICE_KEY:-}
      - PATCHFORM_MAIL_DUMP_DIR=${PATCHFORM_MAIL_DUMP_DIR:-/data/mail}
      # 開発用ログイン: メール未連携でもログインできるよう、ログインリンクを応答に
      # 直接返す（庁外マイ手続きの動作確認用）。本番は必ず 0。
      - PATCHFORM_DEV_LOGIN=${PATCHFORM_DEV_LOGIN:-1}
      # 庁外マイ手続き（外部セッション）。本番は EXT_SECRET を必ず固定値で設定する。
      # 開発では固定の既定値を入れ、コンテナ再起動でログインセッションが失効しないように
      # する（未設定・空だと起動ごとにランダム鍵になり、再起動で「セッションが不正」になる）。
      - PATCHFORM_EXT_SECRET=${PATCHFORM_EXT_SECRET:-dev-ext-secret-change-me}
      - PATCHFORM_MAGIC_TTL_MIN=${PATCHFORM_MAGIC_TTL_MIN:-15}
      - PATCHFORM_EXT_SESSION_TTL_DAYS=${PATCHFORM_EXT_SESSION_TTL_DAYS:-30}
    volumes:
      - patchform_app_data:/data
    ports:
      # 開発用: ゲスト UI/API（/public）をホストから直接確認。本番はホスト公開せず別プロキシへ。
      - "${PATCHFORM_PUBLIC_PORT:-8012}:8012"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  # 手続きマスタ MCP（Dify Agent 等向け Streamable HTTP）
  # エンドポイント: http://host.docker.internal:8013/mcp
  # 公開済みマスタのみ。下書き・提出・束トークンは出さない。
  procedure-mcp:
    profiles: ["patchform"]
    build: ./procedure-mcp
    container_name: open-genai-procedure-mcp
    environment:
      - PATCHFORM_BASE_URL=${PATCHFORM_BASE_URL:-http://patchform-app:8012}
      - RAG_API_KEY=${RAG_API_KEY:-local-rag-key}
      - MCP_HOST=0.0.0.0
      - MCP_PORT=8013
    ports:
      # 注意: procedure-mcp は無認証。到達できれば公開手続きの対応表を読める。
      # 既定は 127.0.0.1。LGWAN-ASP の転送対象に載せないこと。
      - "${PROCEDURE_MCP_BIND:-127.0.0.1}:${PROCEDURE_MCP_PORT:-8013}:8013"
    depends_on:
      - patchform-app
    restart: unless-stopped

volumes:
  backend_data:
  web_node_modules:
  web_pkg_web_node_modules:
  web_pkg_common_node_modules:
  web_pkg_types_node_modules:
  web_pkg_cdk_node_modules:
  qdrant_data:
  keycloak_data:
  whisper_cache:
  dify_app_data:
  rag_app_data:
  seaweedfs_data:
  ollama_data:
  chosei_app_data:
  doccheck_app_data:
  patchform_app_data:
