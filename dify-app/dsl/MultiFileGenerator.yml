                  total = 0
              if coverage == "partial" and not chunk_ids and total > 0:
                  chunk_ids = list(range(min(12, total)))
              if coverage == "full":
                  chunk_ids = list(range(total)) if total > 0 else []
              chunk_ids = chunk_ids[:12] if coverage == "partial" else chunk_ids
              return {
