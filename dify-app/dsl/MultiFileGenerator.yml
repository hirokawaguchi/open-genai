          MAX_CHUNKS_FOR_ITER = 15
          MAX_CHUNK_CHARS = 5000

          def main(text_part1: str, text_part2: str, text_part3: str, need_search: str, search_query: str) -> dict:
              chunks = rebuild_chunks(text_part1, text_part2, text_part3)
