# Open GENAI 本番用 compose（LGWAN 想定 / TLS リバースプロキシ集約）。
#
# 使い方（本番 TLS）:
#   cp .env.prod.example .env.prod
#   # .env.prod の PUBLIC_URL 等を編集
#   # 組織 CA 発行の証明書を proxy/certs/{fullchain.pem,privkey.pem} に配置
#   docker compose -f docker-compose.prod.yml --env-file .env.prod up --build
#
# 使い方（閉域検証: HTTP のみ・自己署名不要・ポート 80）:
#   cp .env.prod.example .env.prod
#   # PUBLIC_URL=http://localhost, PROXY_HTTP_PORT=80 等を編集
#   docker compose -f docker-compose.prod.yml -f docker-compose.verify.yml \
#     --env-file .env.prod up --build
#
# 方針:
# - ユーザに公開するポートは proxy のみ（本番: 80/443、検証: 80 のみ）。
# - web / backend / keycloak / 各 AI アプリ / qdrant はホストにポート公開せず、
#   Docker 内部ネットワークでのみ到達（proxy がパスで振り分ける）。
# - フロントの API 参照は相対パス /api（genai-web 無改修・.env 設定のみ）。

services:
  # 唯一の公開点: TLS を終端し /、/api/、/kc/ を内部サービスへ振り分ける
  proxy:
    image: nginx:1.27-alpine
    container_name: open-genai-proxy
    ports:
      - "${PROXY_HTTP_PORT:-80}:80"
      - "${PROXY_HTTPS_PORT:-443}:443"
    volumes:
      - ./proxy/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./proxy/kc-admin-allow.conf:/etc/nginx/kc-admin-allow.conf:ro
      - ./proxy/certs:/etc/nginx/certs:ro
    depends_on:
      - web
      - backend
      - keycloak
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        PII_INSTALL_NER: ${PII_INSTALL_NER:-0}
    container_name: open-genai-backend
    # ホストにポート公開しない（proxy 経由のみ）
    expose:
      - "8000"
    environment:
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-ollama}
      - DEFAULT_MODEL=${DEFAULT_MODEL:-qwen2.5:7b}
      # チャットタイトル生成方式（heuristic=LLM不使用が既定 / llm）
      - TITLE_MODE=${TITLE_MODE:-heuristic}
      # 複数 OpenAI 互換プロバイダ併用（JSON）。未設定なら OPENAI_* 単一。
      - LLM_PROVIDERS=${LLM_PROVIDERS:-}
      # LLM_PROVIDERS の api_key_env から参照されるプロバイダ別キー
      - SAKURA_API_KEY=${SAKURA_API_KEY:-}
      - OPENAI_PROVIDER_API_KEY=${OPENAI_PROVIDER_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - AZURE_OPENAI_API_KEY=${AZURE_OPENAI_API_KEY:-}
      # Ollama Cloud 等を LLM_PROVIDERS の api_key_env=OLLAMA_API_KEY で使う場合に受け渡す
      - OLLAMA_API_KEY=${OLLAMA_API_KEY:-}
      - DB_PATH=/data/open-genai.db
      # 監査ログ / チャット履歴分離
      - AUDIT_ENABLED=${AUDIT_ENABLED:-true}
      - AUDIT_DB_PATH=/data/audit.db
      - AUDIT_STORE_CONTENT=${AUDIT_STORE_CONTENT:-true}
      - AUDIT_MAX_CONTENT_CHARS=${AUDIT_MAX_CONTENT_CHARS:-8000}
      - AUDIT_RETENTION_DAYS=${AUDIT_RETENTION_DAYS:-1825}
      - LEGACY_CHAT_OWNER=${LEGACY_CHAT_OWNER:-}
      # AI アプリ連携先
      - RAG_APP_URL=${RAG_APP_URL:-http://rag-app:8001/invoke}
      - RAG_API_KEY=${RAG_API_KEY:-local-rag-key}
      - AUDIT_APP_URL=${AUDIT_APP_URL:-http://audit-app:8005/invoke}
      - USERMGMT_APP_URL=${USERMGMT_APP_URL:-http://usermgmt-app:8006/invoke}
      - MODELPOLICY_APP_URL=${MODELPOLICY_APP_URL:-http://modelpolicy-app:8007/invoke}
      - POLICY_DB_PATH=/data/policy.db
      - NGWORD_APP_URL=${NGWORD_APP_URL:-http://ngword-app:8008/invoke}
      - NGWORD_DB_PATH=/data/ngwords.db
      - PROMPT_APP_URL=${PROMPT_APP_URL:-http://prompt-app:8009/invoke}
      # 日程調整（profiles: ["chosei"] で起動。未起動時は専用ページが案内を表示）
      - CHOSEI_APP_URL=${CHOSEI_APP_URL:-http://chosei-app:8010/invoke}
      - CHOSEI_PUBLIC_ENDPOINT=${CHOSEI_PUBLIC_ENDPOINT:-}
      # 書類領域分割チェック（profiles: ["doccheck"]）
      - DOCCHECK_APP_URL=${DOCCHECK_APP_URL:-http://doccheck-app:8011/invoke}
      - DOCCHECK_PUBLIC_ENDPOINT=${DOCCHECK_PUBLIC_ENDPOINT:-}
      # フォーム（profiles: ["patchform"]）
      - PATCHFORM_APP_URL=${PATCHFORM_APP_URL:-http://patchform-app:8012/invoke}
      - PATCHFORM_PUBLIC_ENDPOINT=${PATCHFORM_PUBLIC_ENDPOINT:-}
      - PATCHFORM_SERVICE_KEY=${PATCHFORM_SERVICE_KEY:-}
      # 内部サービス間署名の共有鍵（x-user-* 偽装対策）。全 exApp と同一値・必須。
      - INTERNAL_SIGNING_SECRET=${INTERNAL_SIGNING_SECRET:?INTERNAL_SIGNING_SECRET を設定してください}
      # 成果物取得(SSRF 対策): 許可ホスト(カンマ区切り)とサイズ上限。既知の生成元のみ許可を推奨。
      - ARTIFACT_FETCH_ALLOWED_HOSTS=${ARTIFACT_FETCH_ALLOWED_HOSTS:-}
      - ARTIFACT_MAX_BYTES=${ARTIFACT_MAX_BYTES:-52428800}
      # 成果物ファイルの再ホスト先（自前 S3 互換: SeaweedFS）
      # S3_PUBLIC_ENDPOINT は利用者がインターネットから到達する公開URLを指定すること
      - S3_ENDPOINT_URL=${S3_ENDPOINT_URL:-http://seaweedfs:8333}
      - S3_PUBLIC_ENDPOINT=${S3_PUBLIC_ENDPOINT:?S3_PUBLIC_ENDPOINT（公開URL）を設定してください}
      - S3_BUCKET=${S3_BUCKET:-open-genai}
      - S3_ACCESS_KEY=${S3_ACCESS_KEY:?S3_ACCESS_KEY を設定してください}
      - S3_SECRET_KEY=${S3_SECRET_KEY:?S3_SECRET_KEY を設定してください}
      - S3_PRESIGN_EXPIRY=${S3_PRESIGN_EXPIRY:-86400}
      - S3_ARTIFACT_RETENTION_DAYS=${S3_ARTIFACT_RETENTION_DAYS:-30}
      - S3_ARTIFACT_PURGE_INTERVAL=${S3_ARTIFACT_PURGE_INTERVAL:-86400}
      # 成果物の配信方式（LGWAN 等では carrier 推奨。open は署名付きURLを直接提示）
      - ARTIFACT_DELIVERY_MODE=${ARTIFACT_DELIVERY_MODE:-carrier}
      - ARTIFACT_CARRIER_FORMAT=${ARTIFACT_CARRIER_FORMAT:-txt}
      - DIFY_APP_URL=${DIFY_APP_URL:-http://dify-app:8004/invoke}
      # 源内 Web「画像を生成」(/image/generate) 用 SD サーバ
      # SD_BACKEND: a1111（既定・GPU 自前運用）| fastsd（CPU-only, FastSD を外部起動）
      - SD_BACKEND=${SD_BACKEND:-a1111}
      # 未設定なら a1111=:7860 / fastsd=:8000 が既定。明示すればそれを優先。
      - SD_API_URL=${SD_API_URL:-}
      - SD_TIMEOUT=${SD_TIMEOUT:-600}
      # FastSD 用モデル設定（SD_BACKEND=fastsd のときのみ有効）
      - SD_FASTSD_USE_OPENVINO=${SD_FASTSD_USE_OPENVINO:-false}
      - SD_FASTSD_USE_LCM_LORA=${SD_FASTSD_USE_LCM_LORA:-false}
      - SD_FASTSD_USE_TINY_AUTO_ENCODER=${SD_FASTSD_USE_TINY_AUTO_ENCODER:-false}
      - SD_FASTSD_USE_SAFETY_CHECKER=${SD_FASTSD_USE_SAFETY_CHECKER:-false}
      - SD_FASTSD_MODEL_ID=${SD_FASTSD_MODEL_ID:-}
      - SD_FASTSD_OPENVINO_MODEL_ID=${SD_FASTSD_OPENVINO_MODEL_ID:-}
      # --- 本番 URL（すべて proxy(443) 経由の公開 URL / 相対 /api）---
      - PUBLIC_BASE_URL=${PUBLIC_URL}/api
      - FRONTEND_URL=${PUBLIC_URL}
      - APP_JWT_SECRET=${APP_JWT_SECRET:?APP_JWT_SECRET を .env.prod に設定してください}
      # 起動時の既定パスワード警告用（Keycloak 本体の認証とは別。backend が検知して案内する）
      - KEYCLOAK_ADMIN_PASSWORD=${KEYCLOAK_ADMIN_PASSWORD:?KEYCLOAK_ADMIN_PASSWORD を設定してください}
      - FILES_URL_SECRET=${FILES_URL_SECRET:-}
      - SAML_SP_ENTITY_ID=${PUBLIC_URL}/api/auth/saml/metadata
      - SAML_SP_ACS_URL=${PUBLIC_URL}/api/auth/saml/acs
      - SAML_SP_SLS_URL=${PUBLIC_URL}/api/auth/saml/sls
      # backend からは内部ネットワークで Keycloak(relative /kc) を参照
      - SAML_IDP_METADATA_URL=${SAML_IDP_METADATA_URL:-http://keycloak:8080/kc/realms/open-genai/protocol/saml/descriptor}
    volumes:
      - backend_data:/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      rag-app:
        condition: service_started
      whisper-app:
        condition: service_started
      dify-app:
        condition: service_started
      audit-app:
        condition: service_started
      usermgmt-app:
        condition: service_started
      modelpolicy-app:
        condition: service_started
      ngword-app:
        condition: service_started
      prompt-app:
        condition: service_started
      seaweedfs:
        condition: service_healthy
      keycloak:
        condition: service_started
    restart: unless-stopped

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    container_name: open-genai-keycloak
    # 本番モードで起動（dev モードの start-dev は使わない）。
    # TLS は proxy で終端し、KC には X-Forwarded-* を信頼させる。
    command: ["start", "--import-realm"]
    expose:
      - "8080"
    environment:
      - KC_BOOTSTRAP_ADMIN_USERNAME=${KEYCLOAK_ADMIN:-admin}
      - KC_BOOTSTRAP_ADMIN_PASSWORD=${KEYCLOAK_ADMIN_PASSWORD:?KEYCLOAK_ADMIN_PASSWORD を設定してください}
      # 公開 URL は proxy の /kc。フル URL で指定しないと SAML メタデータに /kc が付かない
      - KC_HOSTNAME=${PUBLIC_URL}/kc
      - KC_HTTP_RELATIVE_PATH=/kc
      - KC_HOSTNAME_STRICT=false
      - KC_HTTP_ENABLED=true
      # proxy からの X-Forwarded-* を信頼（TLS は proxy で終端）
      - KC_PROXY_HEADERS=xforwarded
      # 本番の永続DBは外部RDBを強く推奨（既定の組込H2は本番非推奨）。
      # 例: KC_DB=postgres, KC_DB_URL/KC_DB_USERNAME/KC_DB_PASSWORD を設定し、
      #     初回のみ `kc.sh build` 済みイメージ（--optimized）で運用する。
      - KC_DB=${KC_DB:-dev-file}
    volumes:
      - ./keycloak/import:/opt/keycloak/data/import:ro
      - keycloak_data:/opt/keycloak/data
    restart: unless-stopped

  web:
    build:
      context: ./genai-web
      dockerfile: Dockerfile.prod
      args:
        VITE_APP_API_ENDPOINT: /api
        VITE_APP_TEAM_ACCESS_CONTROL_API_ENDPOINT: /api
        # header | sidebar（.env.prod の VITE_APP_NAV_LAYOUT で上書き可）
        VITE_APP_NAV_LAYOUT: ${VITE_APP_NAV_LAYOUT:-header}
        # 画像生成の初期 step/cfg（既定 50/7。FastSD/LCM を使うビルドでは 4/1 を指定）
        VITE_APP_IMAGE_DEFAULT_STEP: ${VITE_APP_IMAGE_DEFAULT_STEP:-50}
        VITE_APP_IMAGE_DEFAULT_CFG: ${VITE_APP_IMAGE_DEFAULT_CFG:-7}
    container_name: open-genai-web
    expose:
      - "80"
    depends_on:
      - backend
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:latest
    container_name: open-genai-qdrant
    expose:
      - "6333"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

  # 埋め込み配信サイドカー（sentence-transformers / CPU）。任意の埋め込みモデルを
  # OpenAI 互換 API で配信する汎用コンテナ。既定 (mxbai を Ollama で配信) では不要のため
  # profiles で任意起動: `COMPOSE_PROFILES=embed` または `--profile embed` の時のみ起動する。
  # Ollama 等が配信できない埋め込みモデル（例: ruri-v3=ModernBERT-Ja, ONNX 非提供）を
  # 使う場合に有効化し、rag-app の EMBED_BASE_URL をこのサービスへ向ける。
  embed:
    profiles: ["embed"]
    build:
      context: ./embed-app
      dockerfile: Dockerfile
    container_name: open-genai-embed
    environment:
      - EMBED_MODEL=${EMBED_MODEL:-cl-nagoya/ruri-v3-310m}
    volumes:
      - embed_data:/data
    expose:
      - "80"
    restart: unless-stopped

  rag-app:
    build:
      context: .
      dockerfile: rag-app/Dockerfile
      args:
        PII_INSTALL_NER: ${PII_INSTALL_NER:-0}
    container_name: open-genai-rag-app
    environment:
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-ollama}
      - QDRANT_URL=http://qdrant:6333
      # 埋め込みモデルは差し替え可能。既定は Ollama 上の mxbai-embed-large(1024 次元)。
      # モデルを変えると次元が変わるため QDRANT_COLLECTION を分け、再インデックスが必要。
      - QDRANT_COLLECTION=${QDRANT_COLLECTION:-open_genai_rag}
      - EMBED_MODEL=${EMBED_MODEL:-mxbai-embed-large}
      - EMBED_DIM=${EMBED_DIM:-1024}
      # 埋め込みだけ別エンドポイント(embed サイドカー等)へ分離する場合に設定。
      # 未設定(空)なら OPENAI_BASE_URL / OPENAI_API_KEY にフォールバック（従来挙動）。
      - EMBED_BASE_URL=${EMBED_BASE_URL:-}
      - EMBED_API_KEY=${EMBED_API_KEY:-}
      # 検索クエリ/文書の prefix はモデル依存。既定は mxbai 互換（クエリのみ英語 prefix）。
      - "EMBED_QUERY_PREFIX=${EMBED_QUERY_PREFIX-Represent this sentence for searching relevant passages: }"
      - "EMBED_DOC_PREFIX=${EMBED_DOC_PREFIX-}"
      - RAG_MODEL=${RAG_MODEL:-gpt-oss:20b}
      - RAG_API_KEY=${RAG_API_KEY:-local-rag-key}
      # 起動時のサンプル自動投入。false で無効（本番でサンプル不要なら false）。
      - RAG_SEED_SAMPLES=${RAG_SEED_SAMPLES:-true}
      - INTERNAL_SIGNING_SECRET=${INTERNAL_SIGNING_SECRET:?INTERNAL_SIGNING_SECRET を設定してください}
      - RAG_META_DB_PATH=/data/rag_meta.db
      - URL_REFRESH_INTERVAL=${URL_REFRESH_INTERVAL:-86400}
      # URL 取り込みの SSRF 対策: 生成元の既知ホストのみ許可を推奨（カンマ区切り）
      - URL_FETCH_ALLOWED_HOSTS=${URL_FETCH_ALLOWED_HOSTS:-}
      # 入力制限ルール（添付警告・ナレッジ PII）を backend と共有
      - NGWORD_DB_PATH=/ngword-data/ngwords.db
    volumes:
      - rag_app_data:/data
      - backend_data:/ngword-data:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # embed は profiles で任意起動のため depends_on にしない（埋め込みは呼び出し時のみ必要）。
    depends_on:
      - qdrant
    restart: unless-stopped

  # ナレッジ検索 MCP（Dify Agent 向け）。
  # host.docker.internal:${KNOWLEDGE_MCP_PORT} で Dify から利用する。
  knowledge-mcp:
    build: ./knowledge-mcp
    container_name: open-genai-knowledge-mcp
    environment:
      - RAG_BASE_URL=${RAG_BASE_URL:-http://rag-app:8001}
      - RAG_API_KEY=${RAG_API_KEY:-local-rag-key}
      - RAG_DEFAULT_SCOPE=${RAG_DEFAULT_SCOPE:-00000000-0000-0000-0000-000000000000}
      - MCP_HOST=0.0.0.0
      - MCP_PORT=8002
    ports:
      # 無認証。当面は同一サーバ上の Dify のみ想定のため既定は 127.0.0.1。
      # LGWAN-ASP 転送対象に載せないこと。compose 内は http://knowledge-mcp:8002 で到達可。
      - "${KNOWLEDGE_MCP_BIND:-127.0.0.1}:${KNOWLEDGE_MCP_PORT:-8103}:8002"
    depends_on:
      - rag-app
    restart: unless-stopped

  whisper-app:
    build: ./whisper-app
    container_name: open-genai-whisper-app
    environment:
      - RAG_API_KEY=${RAG_API_KEY:-local-rag-key}
      - WHISPER_MODEL=${WHISPER_MODEL:-medium}
      - WHISPER_COMPUTE=${WHISPER_COMPUTE:-int8}
    volumes:
      - whisper_cache:/cache
    restart: unless-stopped

  dify-app:
    build: ./dify-app
    container_name: open-genai-dify-app
    environment:
      - RAG_API_KEY=${RAG_API_KEY:-local-rag-key}
      - DIFY_BASE_URL=${DIFY_BASE_URL:-}
    volumes:
      - dify_app_data:/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  audit-app:
    build: ./audit-app
    container_name: open-genai-audit-app
    environment:
      - RAG_API_KEY=${RAG_API_KEY:-local-rag-key}
      - AUDIT_DB_PATH=/data/audit.db
      - INTERNAL_SIGNING_SECRET=${INTERNAL_SIGNING_SECRET:?INTERNAL_SIGNING_SECRET を設定してください}
    volumes:
      - backend_data:/data
    restart: unless-stopped

  usermgmt-app:
    build: ./usermgmt-app
    container_name: open-genai-usermgmt-app
    environment:
      - RAG_API_KEY=${RAG_API_KEY:-local-rag-key}
      # 本番は Keycloak が relative path /kc 配下のため内部URLも /kc を含める
      - KEYCLOAK_URL=${KEYCLOAK_INTERNAL_URL:-http://keycloak:8080/kc}
      - KEYCLOAK_REALM=${KEYCLOAK_REALM:-open-genai}
      - KEYCLOAK_ADMIN=${KEYCLOAK_ADMIN:-admin}
      - KEYCLOAK_ADMIN_PASSWORD=${KEYCLOAK_ADMIN_PASSWORD:?KEYCLOAK_ADMIN_PASSWORD を設定してください}
      - INTERNAL_SIGNING_SECRET=${INTERNAL_SIGNING_SECRET:?INTERNAL_SIGNING_SECRET を設定してください}
    depends_on:
      - keycloak
    restart: unless-stopped

  modelpolicy-app:
    build: ./modelpolicy-app
    container_name: open-genai-modelpolicy-app
    environment:
      - RAG_API_KEY=${RAG_API_KEY:-local-rag-key}
      - POLICY_DB_PATH=/data/policy.db
      - INTERNAL_SIGNING_SECRET=${INTERNAL_SIGNING_SECRET:?INTERNAL_SIGNING_SECRET を設定してください}
    volumes:
      - backend_data:/data
    restart: unless-stopped

  ngword-app:
    build: ./ngword-app
    container_name: open-genai-ngword-app
    environment:
      - RAG_API_KEY=${RAG_API_KEY:-local-rag-key}
      - NGWORD_DB_PATH=/data/ngwords.db
      - INTERNAL_SIGNING_SECRET=${INTERNAL_SIGNING_SECRET:?INTERNAL_SIGNING_SECRET を設定してください}
    volumes:
      - backend_data:/data
    restart: unless-stopped

  prompt-app:
    build: ./prompt-app
    container_name: open-genai-prompt-app
    environment:
      - RAG_API_KEY=${RAG_API_KEY:-local-rag-key}
      - PROMPT_DB_PATH=/data/prompts.db
      - INTERNAL_SIGNING_SECRET=${INTERNAL_SIGNING_SECRET:?INTERNAL_SIGNING_SECRET を設定してください}
    volumes:
      - backend_data:/data
    restart: unless-stopped

  # 任意: 日程調整（`COMPOSE_PROFILES=chosei` または `--profile chosei`）
  # ホストポートは公開しない。外部ゲストは別プロキシで /public のみ露出すること。
  chosei-app:
    profiles: ["chosei"]
    build: ./chosei-app
    container_name: open-genai-chosei-app
    environment:
      - RAG_API_KEY=${RAG_API_KEY:-local-rag-key}
      - INTERNAL_SIGNING_SECRET=${INTERNAL_SIGNING_SECRET:?INTERNAL_SIGNING_SECRET を設定してください}
      - CHOSEI_DB_PATH=/data/chosei.db
      # profile 有効時は外部公開 URL を必ず設定すること（例: https://chosei.example.lg.jp）
      - CHOSEI_PUBLIC_ENDPOINT=${CHOSEI_PUBLIC_ENDPOINT:-}
      - CHOSEI_RETENTION_DAYS=${CHOSEI_RETENTION_DAYS:-90}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-ollama}
      - CHOSEI_MODEL=${CHOSEI_MODEL:-${DEFAULT_MODEL:-qwen2.5:7b}}
    volumes:
      - chosei_app_data:/data
    expose:
      - "8010"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  # 任意: 書類領域分割チェック（`COMPOSE_PROFILES=doccheck` または `--profile doccheck`）
  # ホストポートは公開しない。外部ゲストは別プロキシで /public のみ露出すること。
  doccheck-app:
    profiles: ["doccheck"]
    build:
      context: ./doccheck-app
      args:
        # amd64 本番で本家を使う場合は DOCCHECK_INSTALL_PADDLEOCR=1
        INSTALL_PADDLEOCR: ${DOCCHECK_INSTALL_PADDLEOCR:-0}
    container_name: open-genai-doccheck-app
    environment:
      - RAG_API_KEY=${RAG_API_KEY:-local-rag-key}
      - INTERNAL_SIGNING_SECRET=${INTERNAL_SIGNING_SECRET:?INTERNAL_SIGNING_SECRET を設定してください}
      - DOCCHECK_DB_PATH=/data/doccheck.db
      - DOCCHECK_DATA_DIR=/data
      - DOCCHECK_PUBLIC_ENDPOINT=${DOCCHECK_PUBLIC_ENDPOINT:-}
      # paddleocr: 本家優先（未導入/arm64→RapidOCR）。hybrid はさらに Vision フォールバック
      - DOCCHECK_OCR_ENGINE=${DOCCHECK_OCR_ENGINE:-paddleocr}
      - DOCCHECK_VISION_MODEL=${DOCCHECK_VISION_MODEL:-gemma3:27b}
      - DOCCHECK_PADDLE_MIN_CONF=${DOCCHECK_PADDLE_MIN_CONF:-0.50}
      - DOCCHECK_PADDLEOCR_FORCE=${DOCCHECK_PADDLEOCR_FORCE:-0}
      - DOCCHECK_PADDLEOCR_LANG=${DOCCHECK_PADDLEOCR_LANG:-japan}
      - DOCCHECK_ASSIGNEES=${DOCCHECK_ASSIGNEES:-3}
      - DOCCHECK_OVERLAP_RATIO=${DOCCHECK_OVERLAP_RATIO:-0.08}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-ollama}
      - DEFAULT_MODEL=${DEFAULT_MODEL:-qwen2.5:7b}
    volumes:
      - doccheck_app_data:/data
    expose:
      - "8011"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  # 任意: フォーム（`COMPOSE_PROFILES=patchform` または `--profile patchform`）
  # ホストポートは公開しない。外部ゲストは別プロキシで /public のみ露出すること。
  patchform-app:
    profiles: ["patchform"]
    build:
      context: .
      dockerfile: patchform-app/Dockerfile

    container_name: open-genai-patchform-app
    environment:
      - RAG_API_KEY=${RAG_API_KEY:-local-rag-key}
      - INTERNAL_SIGNING_SECRET=${INTERNAL_SIGNING_SECRET:?INTERNAL_SIGNING_SECRET を設定してください}
      - PATCHFORM_DB_PATH=/data/patchform.db
      - PATCHFORM_PUBLIC_ENDPOINT=${PATCHFORM_PUBLIC_ENDPOINT:-}
      - PATCHFORM_RETENTION_DAYS=${PATCHFORM_RETENTION_DAYS:-365}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-ollama}
      - PATCHFORM_MODEL=${PATCHFORM_MODEL:-${DEFAULT_MODEL:-qwen2.5:7b}}
      - PATCHFORM_VISION_MODEL=${PATCHFORM_VISION_MODEL:-${DOCCHECK_VISION_MODEL:-gemma3:12b}}
      - PATCHFORM_ENCRYPT_KEY=${PATCHFORM_ENCRYPT_KEY:-}
      - PATCHFORM_FILES_DIR=/data/files
      - PATCHFORM_MAX_UPLOAD_BYTES=${PATCHFORM_MAX_UPLOAD_BYTES:-10485760}
      - PATCHFORM_GBIZ_TOKEN=${PATCHFORM_GBIZ_TOKEN:-}
      - PATCHFORM_SEED=${PATCHFORM_SEED:-0}
      - PATCHFORM_SMTP_HOST=${PATCHFORM_SMTP_HOST:-}
      - PATCHFORM_SMTP_PORT=${PATCHFORM_SMTP_PORT:-587}
      - PATCHFORM_SMTP_USER=${PATCHFORM_SMTP_USER:-}
      - PATCHFORM_SMTP_PASSWORD=${PATCHFORM_SMTP_PASSWORD:-}
      - PATCHFORM_SMTP_STARTTLS=${PATCHFORM_SMTP_STARTTLS:-1}
      - PATCHFORM_SMTP_SSL=${PATCHFORM_SMTP_SSL:-0}
      - PATCHFORM_SMTP_FROM=${PATCHFORM_SMTP_FROM:-}
      - PATCHFORM_STAFF_BASE_URL=${PATCHFORM_STAFF_BASE_URL:-${PUBLIC_URL:-}}
      - PATCHFORM_SERVICE_KEY=${PATCHFORM_SERVICE_KEY:-}
      - PATCHFORM_MAIL_DUMP_DIR=${PATCHFORM_MAIL_DUMP_DIR:-}
      # 庁外マイ手続き（外部セッション）。本番は必ず固定の秘密鍵を設定する。
      - PATCHFORM_EXT_SECRET=${PATCHFORM_EXT_SECRET:-}
      - PATCHFORM_MAGIC_TTL_MIN=${PATCHFORM_MAGIC_TTL_MIN:-15}
      - PATCHFORM_EXT_SESSION_TTL_DAYS=${PATCHFORM_EXT_SESSION_TTL_DAYS:-30}
    volumes:
      - patchform_app_data:/data
    expose:
      - "8012"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  # 手続きマスタ MCP（同一サーバ Dify 向け。LGWAN-ASP 転送対象に載せない）
  procedure-mcp:
    profiles: ["patchform"]
    build: ./procedure-mcp
    container_name: open-genai-procedure-mcp
    environment:
      - PATCHFORM_BASE_URL=${PATCHFORM_BASE_URL:-http://patchform-app:8012}
      - RAG_API_KEY=${RAG_API_KEY:-local-rag-key}
      - MCP_HOST=0.0.0.0
      - MCP_PORT=8013
    ports:
      - "${PROCEDURE_MCP_BIND:-127.0.0.1}:${PROCEDURE_MCP_PORT:-8104}:8013"
    depends_on:
      - patchform-app
    restart: unless-stopped

  # 成果物ファイル配信用の自前オブジェクトストレージ（OSS・S3互換）。
  # 本番: 利用者がインターネットから取得するため、別途 TLS 付きの公開経路
  #       （S3_PUBLIC_ENDPOINT）へ 8333 を露出する構成にすること。
  seaweedfs:
    image: chrislusf/seaweedfs:latest
    container_name: open-genai-seaweedfs
    command: >-
      server -dir=/data -s3 -s3.port=8333
      -s3.config=/etc/seaweedfs/s3.config.json -ip.bind=0.0.0.0
    volumes:
      - seaweedfs_data:/data
      - ./seaweedfs/s3.config.json:/etc/seaweedfs/s3.config.json:ro
    healthcheck:
      # S3 API は起動直後 listen しない。403 も「応答あり」として healthy 扱う。
      # BusyBox wget は 403 で終了コード 8 ではなく 1 を返すため、HTTP ステータスで判定する。
      test: ["CMD-SHELL", "wget -S --spider http://127.0.0.1:8333/ 2>&1 | grep -qE 'HTTP/.* (403|200)'"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 25s
    restart: unless-stopped

volumes:
  backend_data:
  qdrant_data:
  embed_data:
  keycloak_data:
  whisper_cache:
  dify_app_data:
  rag_app_data:
  seaweedfs_data:
  chosei_app_data:
  doccheck_app_data:
  patchform_app_data:
