server {
    listen 80;
    listen [::]:80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA: 実ファイルがなければ index.html へフォールバック
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ハッシュ付きアセットは長期キャッシュ
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
