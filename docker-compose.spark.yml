# DGX Spark / aarch64+CUDA 向けオーバーライド。
# x86_64 や GPU 無しの本番には載せないこと。
#
# 使い方（このホストの閉域 HTTP 検証の例）:
#   docker compose -f docker-compose.prod.yml -f docker-compose.verify.yml \
#     -f docker-compose.spark.yml --env-file .env up -d
#
# Whisper は Dockerfile.spark（CUDA CTranslate2）。画像生成は同梱 sd-server。
# 学習済み重みは ./sd-models/ に置く（gitignore。リポジトリには含めない）。

services:
  whisper-app:
    build:
      context: ./whisper-app
      dockerfile: Dockerfile.spark
    gpus: all
    environment:
      - RAG_API_KEY=${RAG_API_KEY:-local-rag-key}
      - WHISPER_MODEL=${WHISPER_MODEL:-medium}
      - WHISPER_DEVICE=${WHISPER_DEVICE:-cuda}
      - WHISPER_COMPUTE=${WHISPER_COMPUTE:-float16}
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
      - LD_LIBRARY_PATH=/opt/ctranslate2/lib:/opt/cuda13/lib:/usr/local/cuda/lib64
    volumes:
      - whisper_cache:/cache
      - /usr/local/cuda/targets/sbsa-linux/lib:/opt/cuda13/lib:ro
    restart: unless-stopped

  # 源内 /image 向け A1111 互換 SD（llm-router の cu130 torch を流用）
  sd-server:
    build: ./sd-server
    container_name: open-genai-sd-server
    gpus: all
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
      - HF_HOME=/models
      - HF_HUB_DISABLE_XET=1
      - SD_PREFETCH=${SD_PREFETCH:-0}
      - SD_MODEL_ID=${SD_MODEL_ID:-/models/sd-turbo}
    volumes:
      - sd_models:/models
      - ./sd-models/sd-turbo:/models/sd-turbo:ro
    restart: unless-stopped

volumes:
  sd_models:
